# Configuration for scripts/seo_audit.py.
# Every indexable page should have an entry in [[pages]]; unconfigured pages are
# scored as normal pages without a focus keyword and lose points for it.
#
# Terms: each entry in `focus` must appear (all of them). Alternatives are
# separated by "|". Matching ignores case, hyphens and punctuation and also
# matches word beginnings, so "Pflegeheim" matches "Pflegeheims" and "Job"
# matches "Jobs". Keyword density is occurrences per 100 words.
#
# Profiles: money (default), listing, contact, news, legal. Legal pages skip the
# keyword, depth and readability checks.

[site]
base_url = "https://kumpelundhuette.de/"
languages = ["de", "en"]
default_language = "de"
brand = ["Kumpel & Hütte", "Kumpel und Hütte"]
location = "Dortmund"
taxonomy_prefixes = ["/tags/", "/categories/", "/en/tags/", "/en/categories/"]
leak_files = ["bricks/index.xml", "en/bricks/index.xml"]

[thresholds]
page = 90
site = 95
page_share = 0.7
title_min = 30
title_max = 60
description_min = 120
description_max = 160
max_density = 3.0
min_words = { money = 300, listing = 120, contact = 120, news = 120 }

[thresholds.readability.de]
fre_good = 55
fre_bad = 35
asl_good = 14
asl_bad = 22

[thresholds.readability.en]
fre_good = 60
fre_bad = 40
asl_good = 17
asl_bad = 25

[nap]
name = "Kumpel & Hütte"
street = "Im Heidewinkel 30"
postal_code = "44267"
city = "Dortmund"
phone = "+4916090889269"

[structured_data]
always = ["LocalBusiness", "WebSite", "WebPage"]
subpages = ["BreadcrumbList"]
home_paths = ["/", "/en/"]
local_business_types = ["LocalBusiness"]
local_business_fields = [
  "name", "url", "telephone", "image|logo", "priceRange", "openingHoursSpecification",
  "address.streetAddress", "address.postalCode", "address.addressLocality", "address.addressCountry",
  "geo.latitude", "geo.longitude",
]
allow_ratings = false

[style]
excluded_classes = ["breadcrumbs", "door", "callbar", "skip-link"]
decorative_containers = ["news-item__photo", "home-card__photo", "tour__thumb"]
placeholders = ["lorem ipsum", "dolor sit amet", "consectetur adipiscing", "hugobricks", "hpremium", "get started now"]
breadcrumb_words = ["Startseite", "Sie sind hier", "You are here"]

[style.generic_anchors]
de = ["hier", "mehr", "weiter", "weiterlesen", "mehr erfahren", "jetzt mehr erfahren", "klicken sie hier", "hier klicken", "link"]
en = ["here", "more", "read more", "learn more", "click here", "this page", "link"]

[[style.forbidden]]
term = "Lütgendortmund"
allow = "Seniorenb[üu]ros? Lütgendortmund"
reason = "The copy names the city only. The address is Im Heidewinkel 30, 44267 Dortmund (Holzen)."

