<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: comp-1.webp.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Annapurna+SIL:wght@400&family=Martel:wght@700&family=Tuffy:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#5e3d21}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1280px">
  <figure class="r-hero-photo region plate" data-region="hero-photo"><img src="../../../assets/plates/hero-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-logo region text" data-region="logo"><!-- wordmark Kumpel & Hütte in hearty cream serif letters --><p style="font-size:var(--r-logo-font);font-family:var(--r-logo-family),sans-serif;font-weight:var(--r-logo-weight);line-height:1.05;margin:0">logo</p></div>
  <div class="r-nav region text" data-region="nav"><!-- cream serif navigation: Wer wir sind · Unser Zuhause · Einziehen · Einblicke · Kontakt --><p style="font-size:var(--r-nav-font);line-height:1.05;margin:0">nav</p></div>
  <div class="r-call-button region control" data-region="call-button"><!-- brick-red rounded button Anrufen: rebuild the control's chrome from the crop (comp-spec.mjs --crop call-button); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-place-card region chrome" data-region="place-card"><!-- linen place-card with slightly rounded corners holding the hero text and actions --></div>
  <div class="r-headline region text" data-region="headline"><!-- coal-brown hearty serif headline Nicht Heim. Nicht allein. Einfach Zuhause! --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-lede region text" data-region="lede"><!-- two-line sans paragraph Eigenes Zimmer, echte Gesellschaft und Pflege von unserem eigenen Team --><p style="font-size:var(--r-lede-font);font-family:var(--r-lede-family),sans-serif;font-weight:var(--r-lede-weight);line-height:1.05;margin:0">lede</p></div>
  <div class="r-cta-call region control" data-region="cta-call"><!-- brick-red button Anrufen: 0160 90889269: rebuild the control's chrome from the crop (comp-spec.mjs --crop cta-call); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-visit-link region control" data-region="visit-link"><!-- ochre-brown text link Besuch vereinbaren with arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop visit-link); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
