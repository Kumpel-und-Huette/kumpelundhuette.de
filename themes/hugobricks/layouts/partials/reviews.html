<ul class="voices" role="list">
  {{- range . }}
  <li>
    <figure class="quote quote--small">
      <blockquote class="quote__text"><p>{{ .description }}</p></blockquote>
      <figcaption class="quote__by">{{ .name }}{{ with .function }}, {{ . }}{{ end }}</figcaption>
    </figure>
  </li>
  {{- end }}
</ul>
