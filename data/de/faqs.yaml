- title: Leben in der Senioren-WG
  faqs:
    - question: Was ist eine Senioren-WG?
      answer: "In einer Senioren-WG teilen sich ältere Menschen ein Zuhause. Jede und jeder hat ein eigenes Zimmer als Rückzugsort, Küche, Wohnzimmer und Garten nutzen alle gemeinsam. Hauswirtschaft, Betreuung und Pflege erbringt unser Team selbst oder in Kooperation mit Dienstleistungspartnern."
    - question: Für wen ist die Senioren-WG in Dortmund gedacht?
      answer: "Für Menschen, die im Alltag Unterstützung brauchen und/oder sich einsam oder isoliert fühlen und für die ein Pflegeheim nicht in Frage kommt. Unsere WG „Glück auf“ passt ab Pflegegrad 2. Sie kommen tagsüber allein oder mit etwas Hilfe zurecht und sind offen für das Leben in einer Wohngemeinschaft. Ausnahmen beim Pflegegrad sind nach Absprache möglich. Auch pflegende Angehörige, die eine herzliche Alternative suchen, sind bei uns richtig."
    - question: Wie viel Selbstbestimmung bleibt im Alltag?
      answer: "So viel wie möglich. Sie gestalten Ihren Tag selbst und entscheiden, wann und wobei Sie Unterstützung möchten. Ihr Zimmer richten Sie mit Ihren eigenen Möbeln ein, oder wir möblieren es nach Absprache."
    - question: Welche Aktivitäten gibt es?
      answer: "Übers Jahr gibt es Grillabende, Geburtstagsfeiern, Kino- und Theaterbesuche und kleine Ausflüge, im Winter zum Beispiel zum Weihnachtsbaumschlagen. Alles ist ein Angebot: Jeder kann mitmachen, niemand muss."
    - question: Dürfen Paare oder Haustiere mit einziehen?
      answer: "Paare sind bei uns willkommen. Auch ein Haustier ist nach Absprache möglich. Letztendlich entscheiden die Bewohner über neue Mitbewohner und über Haustiere."
    - question: Kann ich die anderen Bewohner vor dem Einzug kennenlernen?
      answer: "Ja, das Kennenlernen gehört bei uns fest dazu. Wer zusammen wohnt, sollte sich vorher einmal in Ruhe begegnet sein. Deshalb treffen Sie die Menschen, die schon bei uns leben, vor Ihrem Einzug, gern bei Kaffee und Kuchen."

- title: Kosten und Pflegekasse
  faqs:
    - question: Was kostet ein Platz in der Senioren-WG?
      answer: "Pflicht ist nur die Miete: 570 € all-inclusive für Strom, Gas, kalte Nebenkosten, Internet und ggf. die GEZ. Hauswirtschaft und Betreuung sind ein optionaler Servicevertrag. Die Preise richten sich nach dem Bedarf, eine stundenweise Abrechnung ist möglich, und sie folgen den Landesvorgaben. Mehr dazu auf heykumpel.com. Bei einem Pflegegrad kann die Pflegekasse diese Leistungen übernehmen."
    - question: Zahlt die Pflegekasse für die Senioren-WG?
      answer: "Ab Pflegegrad 2 kommen für die Alltagsbegleitung Leistungen der Pflegekasse in Frage: der Wohngruppenzuschlag nach § 38a SGB XI ab 3 Personen und der Entlastungsbetrag. Zusätzlich können 40 % der Pflegesachleistungen umgewandelt werden, und die Verhinderungspflege von 3.539 € kann für unsere Angebote genutzt werden. Ab 2027 soll das PNOG die Budgets verändern, falls das Gesetz so in Kraft tritt. Was in Ihrem Fall gilt, klären wir gemeinsam mit Ihnen und Ihrer Pflegekasse."
    - question: Reicht meine Rente, auch wenn sie klein ist?
      answer: "Gutes Wohnen im Alter soll nicht an der Rente scheitern. Die Miete von 570 € liegt im Rahmen der Grundsicherung in Dortmund. Reicht Ihre Rente nicht aus, klären wir mit Ihnen, ob das Sozialamt einen Teil übernimmt, und helfen beim Antrag."
    - question: Kann ich dauerhaft bei Ihnen wohnen?
      answer: "Ja, wir bieten langfristige Wohnplätze. Kumpel & Hütte ist kein Angebot auf Zeit, sondern ein echtes Zuhause."

- title: Pflege, Sicherheit und Angehörige
  faqs:
    - question: Wer übernimmt die Pflege?
      answer: "Die Pflege erbringen unsere Kooperationspartner, in Absprache mit Ihnen und uns. Hauswirtschaft und Betreuung übernimmt unser Team oder ebenfalls ein Partner. Die WG hat das Hausrecht: Sie entscheiden, wer pflegt und hilft, wie viel, wie oft und wie lange."
    - question: Ist die Wohnung barrierefrei?
      answer: "Nicht immer vollständig, das hängt von der WG ab, und das sagen wir offen. Die Räume sind aber alltagstauglich eingerichtet: mit bodengleicher Dusche, Handläufen und durchdachter Beleuchtung. Bei der Besichtigung sehen Sie selbst, ob das für Sie passt."
    - question: Wie sicher ist das Wohnen bei Ihnen?
      answer: "Im Alltag ist unser Team vor Ort, und die Mitbewohner sind nicht weit. Nach Absprache richten wir zusätzlich ein Notrufsystem ein, das rund um die Uhr erreichbar ist. Wer zu Hause schon einmal gestürzt ist und niemand war da, weiß, wie viel das wert ist."
    - question: Können sich Angehörige einbringen?
      answer: "Sehr gern. Wir arbeiten eng mit Familien zusammen, und der Kontakt zu Angehörigen gehört fest zu unserer Betreuung. Sie bekommen klare Auskunft über alle Leistungen und Abläufe, und Besuch ist bei uns willkommen."
    - question: Wo in Dortmund liegt die Senioren-WG?
      answer: "Unsere Adresse ist Im Heidewinkel 30, 44267 Dortmund. Rufen Sie uns an unter [0160 90889269](tel:+4916090889269), dann vereinbaren wir einen Termin, an dem Sie sich alles in Ruhe ansehen können."

- title: Senioren-WG, Pflegeheim oder betreutes Wohnen?
  faqs:
    - question: Was unterscheidet die Senioren-WG von einem Pflegeheim oder Altenheim?
      answer: "Vor allem das Gefühl, zu Hause zu sein. Statt eines großen Hauses mit festen Abläufen haben Sie ein eigenes Zimmer in einer familiären Hausgemeinschaft, eine gemeinsame Küche und Menschen, die Sie beim Namen kennen. Sie gestalten Ihren Tag selbst. Wer für sich oder die eigenen Eltern eine Alternative zum Pflegeheim in Dortmund sucht, kann sich bei uns in Ruhe umsehen."
    - question: Ist eine Senioren-WG das Gleiche wie betreutes Wohnen?
      answer: "Nicht ganz. Beim betreuten Wohnen leben Sie meist allein in einer eigenen Wohnung und buchen Hilfe dazu. In unserer Senioren-WG haben Sie Ihr eigenes Zimmer und dazu Gesellschaft: Küche, Wohnzimmer und Garten teilen Sie mit anderen. Hauswirtschaft, Betreuung und Pflege können von unserem Team oder von Partnern kommen, wenn Sie das möchten. Wer betreutes Wohnen in Dortmund sucht, aber nicht allein sein möchte, ist bei uns richtig."
