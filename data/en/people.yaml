- name: Robin und Julianne Grunwald
  function: Founders of Kumpel & Hütte
  image: /uploads/photos/team/Juli_und_Robin_Business_2_close.JPG
  description: "Kumpel & Hütte is the project closest to our hearts. We want to push back against loneliness in old age and help people who need support to live with dignity, self-determination and company. What began as a personal idea has become a housing concept with a future: family-like, affordable and human. We believe nobody has to stay alone in old age, if we are willing to do things differently."

  mail: robin@kumpelundhuette.de
- name: Guilia 
  function: Carer and support worker
  image: /uploads/photos/team/Guilia_Russner.jpg
  description: "For me, working in the shared home is much more than a job. It is a place where I can spend time with people as equals, with all their stories, quirks and very personal needs. I am glad to help with the things that have become harder in everyday life. But what matters even more to me: I am simply there. With open ears, an honest laugh and the calm that is needed, including for the quiet moments. In the shared home, real togetherness grows. People eat together, laugh, sometimes stay silent, but never forget that every person counts. I am proud to be part of it. Because the work with the residents touches me, moves me and gives me back just as much as I put in."
- name: Aman Roy
  function: IT Consultant
  image: /uploads/photos/team/Aman_Roy_portrait.jpg
  description: "I help the team with the technical stuff, preferably so well that people forget I was involved. When something creaks, I grumble quietly and get it moving again. When nothing creaks, I was probably already there. I like technology best when it makes itself invisible. Coffee is my most important tool. Sometimes my only one."
