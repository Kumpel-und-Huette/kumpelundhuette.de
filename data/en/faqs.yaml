- title: Living at Kumpel und Hütte
  faqs:
    - question: Who is Kumpel und Hütte for?
      answer: "Our shared homes are for people with care grade 2 who want to live safely, affordably and in company — with as much support as needed and as much self-determination as possible."
    - question: How much independence do residents keep?
      answer: "Self-determination is one of our core values. Our residents shape their everyday life themselves and decide where and when they want support."
    - question: What activities are offered?
      answer: "Throughout the year we organise small celebrations and outings: barbecue evenings, birthday parties, cinema and theatre visits as well as cultural events — for more joy of life and community."

- title: Costs and services
  faqs:
    - question: Is living at Kumpel und Hütte affordable?
      answer: "Yes, we place great importance on affordable housing. Our goal is to make high-quality, safe living accessible to as many people as possible."
    - question: What services are included?
      answer: "In addition to living space we offer everyday support, household help, care, organisation of activities, accompaniment when needed and a warm, stable environment."
    - question: Are there long-term housing options?
      answer: "Yes, we offer stable, long-term housing solutions — Kumpel und Hütte is not a short-term offer, but a real home."

- title: Safety and trust
  faqs:
    - question: How is residents’ safety ensured?
      answer: "Our flats are designed so that residents feel safe and sheltered. Our team provides supportive presence and looks after a trusting community."
    - question: Can family members get involved?
      answer: "Very much so. We actively encourage exchange and involvement of relatives and work closely with families to ensure the best possible care."
    - question: How transparent is the care?
      answer: "Transparency and trust are a given for us. Relatives and residents always receive clear information about all services and processes."
