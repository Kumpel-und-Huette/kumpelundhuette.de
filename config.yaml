baseURL: "https://kumpelundhuette.de/"
title: Kumpel und Hütte
theme: hugobricks
defaultContentLanguage: de
assetDir: static
enableRobotsTXT: true
disableKinds:
  - taxonomy
  - term
outputs:
  home: [html]
  section: [html]

params:
  showImageCaptions: false
  googleAnalytics: G-N2XJVQ6L2F

module:
  mounts:
    - source: static
      target: assets
    - source: assets/plates
      target: assets/plates

caches:
  images:
    dir: :cacheDir/images

markup:
  goldmark:
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
    renderer:
      unsafe: true
    extensions:
      extras:
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true

languages:
  de:
    label: Deutsch
    contentDir: content/de
    weight: 1
    disabled: false
    permalinks:
      page:
        posts: /unser-zuhause/:slug
        services: /neuigkeiten/:contentbasename
      section:
        posts: /unser-zuhause/
  en:
    label: English
    contentDir: content/en
    weight: 2
    disabled: false
    permalinks:
      page:
        posts: /our-home/:slug
        services: /news/:slug
      section:
        posts: /our-home/
