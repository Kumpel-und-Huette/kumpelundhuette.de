{{- $c := partial "contact-data.html" . -}}
<ul class="contact-actions" role="list">
  {{- with $c.phone }}<li><a class="button button--call" href="{{ $c.tel }}">{{ partial "icon.html" "phone" }}<span>{{ . }}</span></a></li>{{ end }}
  {{- with $c.email }}<li><a class="button button--quiet" href="mailto:{{ . }}">{{ partial "icon.html" "mail" }}<span>{{ . }}</span></a></li>{{ end }}
</ul>
