- name: Robin und Julianne Grunwald
  function: Managing directors and founders of Kumpel & Hütte
  image: /uploads/photos/team/Juli_und_Robin_Business_2_close.JPG
  description: "Kumpel & Hütte is our heartfelt project! With the vision of countering growing loneliness especially in older age and enabling people who need support to live with dignity, self-determination and community. What began as a personal idea is growing into a housing concept with a future. Familial, affordable and human. We believe nobody has to stay alone in older age — if we do things differently."

  mail: robin@kumpelundhuette.de
- name: Guilia 
  function: Carer and support worker
  image: /uploads/photos/team/Guilia_Russner.jpg
  description: "For me, working in the shared home is much more than a job. It is a place where I can spend time with people as equals — with all their stories, quirks and very individual needs. I am glad to help with the things that have become harder in everyday life. But what matters even more to me: I am simply there. With open ears, an honest laugh and the calm that is needed — including for the quiet moments. In the shared home, real togetherness grows. People eat together, laugh, sometimes stay silent — but never forget that every person counts. I am proud to be part of it. Because the work with the residents touches, moves and gives me back just as much as I put in."
