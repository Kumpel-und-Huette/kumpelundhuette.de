<ul class="buttons">
    {{- if (index hugo.Data page.Language.Name).general.contact.phone -}}
        <li><a href="tel:{{ replace (index hugo.Data page.Language.Name).general.contact.phone " " "" }}" class="button icon"><img src="/img/phone.svg" alt="{{ (index hugo.Data page.Language.Name).general.contact.phone }}" /></a></li>
    {{- end -}}
    {{- if (index hugo.Data page.Language.Name).general.contact.email -}}
        <li><a href="mailto:{{ (index hugo.Data page.Language.Name).general.contact.email }}" class="button icon"><img src="/img/email.svg" alt="{{ (index hugo.Data page.Language.Name).general.contact.email }}" /></a></li>
    {{- end -}}
</ul>
