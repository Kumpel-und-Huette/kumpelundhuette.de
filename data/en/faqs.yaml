- title: Living in the senior shared home
  faqs:
    - question: What is a senior shared home (Senioren-WG)?
      answer: "In a senior shared home, older people share one household. Everyone has their own room to retreat to, while the kitchen, living room and garden are shared. Our team provides housekeeping, personal support and nursing care itself, or together with service partners."
    - question: Who is the senior shared home in Dortmund for?
      answer: "For people who need support in everyday life and/or feel lonely or isolated, and for whom a care home is not an option. Our shared home “Glück auf” suits people with care grade 2 or higher (Pflegegrad 2). They manage the day on their own or with a little help and are open to living in a shared home. Exceptions on the care grade are possible by arrangement. Family carers looking for a warm alternative are in the right place with us too."
    - question: How much independence do residents keep?
      answer: "As much as possible. You shape your own day and decide when and with what you would like support. You furnish your room with your own things, or we furnish it for you by arrangement."
    - question: What activities are there?
      answer: "Throughout the year there are barbecue evenings, birthday parties, trips to the cinema and theatre and small outings, in winter for example to cut a Christmas tree. Everything is an offer: everyone can join in, nobody has to."
    - question: Can couples or pets move in?
      answer: "Couples are welcome. A pet is also possible by arrangement. In the end, the residents decide on new housemates and on pets."
    - question: Can I meet the other residents before moving in?
      answer: "Yes, getting to know each other is a fixed part of moving in. People who are going to live together should have met properly first. So before you move in, you meet the people who already live here, ideally over coffee and cake."

- title: Costs and care insurance
  faqs:
    - question: How much does a place in the senior shared home cost?
      answer: "The only mandatory amount is the rent: €570 all-inclusive for electricity, gas, cold utilities, internet and the TV licence if applicable. Housekeeping and personal support are an optional service contract. Prices depend on what you need, hourly billing is possible, and they follow state guidelines. There is more on heykumpel.com. With a care grade, the care insurance can cover these services."
    - question: Does the care insurance (Pflegekasse) pay?
      answer: "From care grade 2, care-insurance benefits can cover everyday support: the residential group supplement under § 38a SGB XI (Wohngruppenzuschlag) from 3 people, and the relief amount (Entlastungsbetrag). In addition, 40% of in-kind care benefits can be converted, and the respite-care budget (Verhinderungspflege) of €3,539 can be used for our services. From 2027 the PNOG is due to change the budgets, if the law comes into force in that form. We work out together with you and your Pflegekasse what applies in your case."
    - question: Is a small pension enough?
      answer: "Good housing in old age should not depend on the size of your pension. The rent of €570 is within the limits for basic income support (Grundsicherung) in Dortmund. If your pension is not enough, we check with you whether the social welfare office (Sozialamt) can cover part of it, and we help with the application."
    - question: Can I live with you long term?
      answer: "Yes, we offer long-term places. Kumpel & Hütte is not a temporary offer, but a real home."

- title: Care, safety and family
  faqs:
    - question: Who provides the nursing care?
      answer: "Our cooperation partners provide the nursing care, in agreement with you and with us. Our team, or a partner as well, provides housekeeping and personal support. The shared home has the right of the house: you decide who provides care and help, how much, how often and for how long."
    - question: Is the home barrier-free?
      answer: "Not always fully. It depends on the shared home, and we say so openly. The rooms are practical for everyday life though, with a floor-level shower, handrails and well-planned lighting. When you visit, you can see for yourself whether it suits you."
    - question: How safe is living with you?
      answer: "During the day our team is on site, and your housemates are not far away. By arrangement we also set up an emergency call system that can be reached around the clock. Anyone who has fallen at home with nobody there knows how much that is worth."
    - question: Can family members get involved?
      answer: "Very much so. We work closely with families, and keeping in touch with relatives is a fixed part of our support. You get clear information about all services and routines, and visitors are welcome."
    - question: Where in Dortmund is the senior shared home?
      answer: "Our address is Im Heidewinkel 30, 44267 Dortmund, Germany. Call us on [+49 160 90889269](tel:+4916090889269) and we will arrange a time for you to look around in peace."

- title: Shared home, care home or assisted living?
  faqs:
    - question: How is this different from a care home or an old-age home?
      answer: "Above all, it feels like home. Instead of a large building with fixed routines, you have your own room in a family-like household, a shared kitchen and people who know you by name. You shape your own day. If you are looking for an alternative to a care home in Dortmund, for yourself or for your parents, you are welcome to come and take a look."
    - question: Is a senior shared home the same as assisted living?
      answer: "Not quite. In assisted living you usually live alone in your own flat and book help on top. In our senior shared home you have your own room plus company: you share the kitchen, living room and garden with others. Housekeeping, personal support and nursing care can come from our team or from partners, if that is what you want. If you are looking for assisted living in Dortmund but do not want to be alone, you are in the right place."
