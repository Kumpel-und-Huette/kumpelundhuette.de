baseURL: "https://kumpelundhuette.de/"
title: Kumpel und Hütte
theme: hugobricks
defaultContentLanguage: de
assetDir: static

caches:
  images:
    dir: :cacheDir/images

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      extras:
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true

languages:
  de:
    label: Deutsch
    contentDir: content/de
    weight: 1
    disabled: false
    permalinks:
      page:
        posts: /unser-zuhause/:slug
        services: /neuigkeiten/:contentbasename
      section:
        posts: /unser-zuhause/
  en:
    label: English
    contentDir: content/en
    weight: 2
    disabled: false
    permalinks:
      page:
        posts: /our-home/:slug
        services: /news/:slug
      section:
        posts: /our-home/
